name: Terraform OIDC — verify plan (safe)

on:
  workflow_dispatch:
    inputs:
      region:
        description: 'AWS region to use for the verification run'
        required: false
        default: 'ap-south-1'
      use_remote_backend:
        description: 'If true, attempt to use remote S3 backend (ensure backend exists); otherwise runs with -backend=false'
        required: false
        default: 'false'

permissions:
  id-token: write
  contents: read

jobs:
  terraform-plan-verify:
    name: Terraform plan (verify only)
    runs-on: ubuntu-latest
    env:
      TF_WORKDIR: infra/terraform/envs/dev

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ github.event.inputs.region }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.8.5'

      - name: Terraform init & plan (safe)
        env:
          TF_IN_AUTOMATION: true
        run: |
          set -euo pipefail
          terraform -chdir="${TF_WORKDIR}" init -input=false -backend=false
          terraform -chdir="${TF_WORKDIR}" validate -no-color || true
          terraform -chdir="${TF_WORKDIR}" plan -out=tfplan -input=false -no-color || true

      - name: Upload plan artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dev-env-tfplan
          path: infra/terraform/envs/dev/tfplan

      - name: Print note
        run: echo "Plan finished — check the logs and the artifact dev-env-tfplan for details. This workflow runs a non-destructive plan (no apply)."
