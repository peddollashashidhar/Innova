name: Terraform CI (OIDC)

on:
  pull_request:
    paths:
      - 'infra/**'

  push:
    branches:
      - feature

  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  TF_WORKDIR: infra/terraform/envs/dev
  TF_BACKEND_FILE: backend.hcl

jobs:
  plan:
    name: Terraform plan (PR)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform fmt check (repo)
        run: terraform -chdir=infra/terraform fmt -check -recursive

      - name: Terraform Init (no backend)
        env:
          TF_IN_AUTOMATION: true
        run: terraform -chdir="${{ env.TF_WORKDIR }}" init -backend=false -input=false

      - name: Terraform Validate
        run: terraform -chdir="${{ env.TF_WORKDIR }}" validate -no-color

      - name: Terraform Plan
        env:
          TF_IN_AUTOMATION: true
        run: |
          terraform -chdir="${{ env.TF_WORKDIR }}" plan \
            -var-file=terraform.tfvars \
            -out=plan.binary \
            -input=false \
            -no-color
          terraform -chdir="${{ env.TF_WORKDIR }}" show -no-color plan.binary > plan.txt

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: dev-env-plan
          path: infra/terraform/envs/dev/plan.txt

  apply:
    name: Terraform apply
    runs-on: ubuntu-latest
    # allow apply only when explicitly triggered or on push to feature
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/feature')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init (remote backend)
        env:
          TF_IN_AUTOMATION: true
        run: |
          terraform -chdir="${{ env.TF_WORKDIR }}" init \
            -input=false \
            -backend-config="${{ env.TF_BACKEND_FILE }}"

      - name: Terraform Apply
        run: |
          terraform -chdir="${{ env.TF_WORKDIR }}" plan \
            -var-file=terraform.tfvars \
            -out=plan.binary \
            -input=false \
            -no-color
          terraform -chdir="${{ env.TF_WORKDIR }}" apply -input=false plan.binary
