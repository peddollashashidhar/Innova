name: Terraform CI (OIDC)

on:
  pull_request:
    paths:
      - 'infra/**'

  push:
    branches:
      - feature-clean

  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1

jobs:
  plan:
    name: Terraform plan (PR)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2

      - name: Terraform Init
        working-directory: infra
        run: terraform init -input=false

      - name: Terraform Format
        working-directory: infra
        run: terraform fmt -check

      - name: Terraform Validate
        working-directory: infra
        run: terraform validate -no-color

      - name: Terraform Plan
        working-directory: infra
        run: |
          terraform plan -var "region=${{ env.AWS_REGION }}" -out=plan.binary
          terraform show -no-color plan.binary > plan.txt

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: infra-plan
          path: infra/plan.txt

  apply:
    name: Terraform apply
    runs-on: ubuntu-latest
    needs: plan
    # allow apply only when explicitly triggered or on push to feature-clean
    if: "github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/feature-clean')"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2

      - name: Terraform Init
        working-directory: infra
        run: terraform init -input=false

      - name: Terraform Apply
        working-directory: infra
        run: |
          terraform plan -var "region=${{ env.AWS_REGION }}" -out=plan.binary
          terraform apply -input=false plan.binary
