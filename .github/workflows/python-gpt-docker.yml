name: python-gpt Docker CI

on:
  workflow_dispatch:
    inputs:
      run_e2e:
        description: 'Run end-to-end tests that call OpenAI (requires OPENAI_API_KEY secret)'
        required: false
        default: 'false'
      publish_image:
        description: 'Publish built image to GitHub Container Registry (GHCR)'
        required: false
        default: 'false'
  push:
    branches:
      - feature-clean
  pull_request:
    # Run checks for opened/synchronized/reopened PRs so mock integration tests can run
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build image
        uses: docker/build-push-action@v4
        with:
          context: ./python-gpt
          push: false
          tags: python-gpt:ci-${{ github.sha }}

      - name: Smoke test: run --help
        run: |
          docker run --rm python-gpt:ci-${{ github.sha }} --help

      - name: Set up Python 3.11 for tests
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install test deps
        run: |
          python -m pip install -U pip
          python -m pip install -r python-gpt/requirements.txt -r python-gpt/requirements-dev.txt

      - name: Run unit tests
        working-directory: python-gpt
        run: |
          python -m pytest -q

  integration-mock:
    name: PR mock integration (no-cost)
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image for PR mock
        uses: docker/build-push-action@v4
        with:
          context: ./python-gpt
          push: false
          tags: python-gpt:pr-mock-${{ github.sha }}

      - name: Run mock integration prompts
        run: |
          mkdir -p pr-outputs
          # run container with OPENAI_MOCK=1 (no network / no secret usage)
          docker run --rm -e OPENAI_MOCK=1 -v "${{ github.workspace }}/pr-outputs:/app/outputs" python-gpt:pr-mock-${{ github.sha }} --prompts-file python-gpt/sample_prompts.txt --output /app/outputs/pr.csv
          echo "PR integration output preview:";
          head -n 5 pr-outputs/pr.csv || true
          if [ ! -s pr-outputs/pr.csv ]; then echo "PR mock output file is missing or empty"; exit 1; fi

  e2e:
    name: Optional E2E (uses OPENAI_API_KEY)
    runs-on: ubuntu-latest
    needs: build-and-test
    if: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.run_e2e == 'true') || (secrets.OPENAI_API_KEY != '') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image for E2E
        uses: docker/build-push-action@v4
        with:
          context: ./python-gpt
          push: false
          tags: python-gpt:ci-e2e-${{ github.sha }}

      - name: Run E2E prompts (must have OPENAI_API_KEY set)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          mkdir -p e2e-outputs
          docker run --rm -e OPENAI_API_KEY="$OPENAI_API_KEY" -v "${{ github.workspace }}/e2e-outputs:/app/outputs" python-gpt:ci-e2e-${{ github.sha }} --prompts-file python-gpt/sample_prompts.txt --output /app/outputs/e2e.csv
          echo "E2E output preview:";
          head -n 5 e2e-outputs/e2e.csv || true
          if [ ! -s e2e-outputs/e2e.csv ]; then echo "E2E output file is missing or empty"; exit 1; fi

  publish:
    name: Publish image to GHCR
    runs-on: ubuntu-latest
    needs: build-and-test
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/feature-clean') || (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_image == 'true') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v4
        with:
          context: ./python-gpt
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/python-gpt:latest
            ghcr.io/${{ github.repository_owner }}/python-gpt:${{ github.sha }}
