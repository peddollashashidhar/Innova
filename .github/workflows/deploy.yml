name: Build, Push, Terraform Apply & Deploy

on:
  push:
    branches:
      - main

env:
  TF_WORKING_DIR: infra

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      packages: write
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr_login
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build and push frontend image
        working-directory: angular-app
        run: |
          REPO=${{ secrets.ECR_FRONTEND_REPO }}
          TAG=latest
          docker build -t "$REPO:$TAG" .
          docker push "$REPO:$TAG"
          echo "FRONTEND_IMAGE=$REPO:$TAG" >> $GITHUB_ENV

      - name: Build and push backend image
        working-directory: demo
        run: |
          REPO=${{ secrets.ECR_BACKEND_REPO }}
          TAG=latest
          docker build -t "$REPO:$TAG" .
          docker push "$REPO:$TAG"
          echo "BACKEND_IMAGE=$REPO:$TAG" >> $GITHUB_ENV

      - name: Terraform Init
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.6

      - name: Terraform Apply
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          terraform init -input=false
          terraform apply -auto-approve -input=false

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: '1.27.0'

      - name: Set up Helm
        uses: azure/setup-helm@v1
        with:
          version: '3.12.0'

      - name: Helm lint frontend
        run: |
          helm lint infra/helm/frontend --strict

      - name: Helm lint backend
        run: |
          helm lint infra/helm/backend --strict

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --name $(terraform -chdir=infra output -raw cluster_id) --region ${{ secrets.AWS_REGION }}

      - name: Deploy to Kubernetes
        run: |
          # Deploy or upgrade frontend via Helm
          helm upgrade --install angular-frontend infra/helm/frontend \
            --namespace innova --create-namespace \
            --set image.repository="$FRONTEND_IMAGE" \
            --set image.tag="latest"

          # Deploy or upgrade backend via Helm
          helm upgrade --install demo-backend infra/helm/backend \
            --namespace innova --create-namespace \
            --set image.repository="$BACKEND_IMAGE" \
            --set image.tag="latest"
